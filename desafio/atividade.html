<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
</head>
<body>

    <h1>Temperaturas da Semana</h1>

    <button onclick="calcularTemperaturas()">
        Informar temperaturas
    </button>

    <div id="resultado"></div>

    <script>
        function calcularTemperaturas() {

            // Vetor com os dias da semana
            let dias = [
                "Segunda-feira",
                "Terça-feira",
                "Quarta-feira",
                "Quinta-feira",
                "Sexta-feira",
                "Sábado",
                "Domingo"
            ];

            // Vetor que armazenará as temperaturas
            let temperaturas = [];

            // Variáveis para os cálculos
            let soma = 0;
            let acima = 0;
            let abaixo = 0;

            // Solicitar as temperaturas dos 7 dias
            for (let i = 0; i < 7; i++) {
                temperaturas[i] = Number(
                    prompt("Digite a temperatura de " + dias[i] + ":")
                );

                soma = soma + temperaturas[i];
            }

            // Calcular a média do período
            let media = soma / 7;

            // Preparar a exibição dos resultados
            let resultado = "<h2>Resultados da semana</h2>";

            resultado += "<p>Média das temperaturas: "
                + media.toFixed(2) + " °C</p>";

            resultado += "<h3>Temperaturas por dia</h3>";

            // Exibir os dias e suas temperaturas
            for (let i = 0; i < 7; i++) {

                resultado += "<p>" + dias[i] + ": "
                    + temperaturas[i] + " °C</p>";

                // Verificar se ficou acima ou abaixo da média
                if (temperaturas[i] > media) {
                    acima++;
                } else if (temperaturas[i] < media) {
                    abaixo++;
                }
            }

            // Exibir as quantidades
            resultado += "<p>Dias acima da média: "
                + acima + "</p>";

            resultado += "<p>Dias abaixo da média: "
                + abaixo + "</p>";

            document.getElementById("resultado").innerHTML =
                resultado;
        }
    </script>

</body> 
</html>
