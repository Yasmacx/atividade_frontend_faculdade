<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
</head>
<body>

    <h1>Temperaturas da Semana</h1>

    <button onclick="calcularTemperaturas()"> <!--input do usuario, botao flutuante-->
        Informar temperaturas
    </button>

    <div id="resultado"></div> 

    <!--logica da programação em html-->
    <script>
        function calcularTemperaturas() {

            let dias = [
                "Segunda-feira",
                "Terça-feira",
                "Quarta-feira",
                "Quinta-feira",
                "Sexta-feira",
                "Sábado",
                "Domingo"
            ];

            // funcao do calculo
            let temperaturas = [];

            let soma = 0;
            let acima = 0;
            let abaixo = 0;

            for (let i = 0; i < 7; i++) {
                temperaturas[i] = Number(
                    prompt("Digite a temperatura de " + dias[i] + ":")
                );

                soma = soma + temperaturas[i];
            }

            let media = soma / 7;

            let resultado = "<h2>Resultados da semana</h2>";

            resultado += "<p>Média das temperaturas: "
                + media.toFixed(2) + " °C</p>";

            resultado += "<h3>Temperaturas por dia</h3>";

            for (let i = 0; i < 7; i++) {

                resultado += "<p>" + dias[i] + ": "
                    + temperaturas[i] + " °C</p>";

                if (temperaturas[i] > media) {
                    acima++;
                } else if (temperaturas[i] < media) {
                    abaixo++;
                }
            }

            resultado += "<p>Dias acima da média: "
                + acima + "</p>";

            resultado += "<p>Dias abaixo da média: "
                + abaixo + "</p>";

            document.getElementById("resultado").innerHTML =
                resultado;
        }
    </script>

</body> 
</html>
