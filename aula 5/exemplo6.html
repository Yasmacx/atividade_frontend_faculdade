<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //modo 1
        let a;
        let aux = prompt("Digite o valor de a","");
        a = parseInt(aux);

        //modo 2
        let b = parseInt(prompt("Digite o valor de b: ",""));

        //mostra o calculo
        alert(a + "+ " + b  + " = " + (a+b))
        
        //ou
        alert('${a} + ${b} = ${a+b}' );
    </script>
</body>
</html>
