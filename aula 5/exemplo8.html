    <title>Exemplo 8</title>
</head>
<body>
    <script>
        let a;
        let b;
        let c;
        let d;

        a = parseFloat(prompt("Digite numero 1:"));
        b = parseFloat(prompt("Digite numero 2:"));
        c = parseFloat(prompt("Digite numero 3:"));
        d = parseFloat(prompt("Digite numero 4:"));
        
        let media = (a + b + c + d) / 4;

        alert("A media é:" + media);
   </script>
